<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071221">
  <title>星雪圣诞树</title>
  <meta name="description" content="用食指画圈点亮一棵圣诞树，再撒出烟花和雪。">
  <link rel="icon" href="data:,">
  <link rel="preload" href="./christmas/fonts/great-vibes-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./christmas/style.css">
  <script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js"}}</script>
  <script type="module" src="./christmas/main.js"></script>
</head>
<body>
  <main class="experience" id="experience" data-style="3d">
    <canvas id="stage" aria-label="可旋转的雪霜圣诞树场景" tabindex="0"></canvas>
    <p id="greeting" class="greeting" lang="en" hidden><span>Merry Christmas</span></p>
    <header class="bar">
      <div class="actions">
        <a class="button button-icon button-home" href="./" aria-label="返回手势游乐园首页" title="返回首页">
          <svg class="home-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M12.5 5L7.5 10L12.5 15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>
      <div class="actions">
        <button class="button button-camera" id="camera" type="button" data-live="false">
          <svg class="camera-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <rect x="2.2" y="5.2" width="11.1" height="9.6" rx="2.5" stroke="currentColor" stroke-width="1.55"/>
            <path d="M13.4 8.55L17.1 6.42C17.68 6.08 18.4 6.5 18.4 7.18V12.82C18.4 13.5 17.68 13.92 17.1 13.58L13.4 11.45" stroke="currentColor" stroke-width="1.55" stroke-linejoin="round"/>
            <circle class="camera-live-dot" cx="5.6" cy="8.5" r="1.25" fill="currentColor"/>
          </svg>
          <span id="camera-label">开启摄像头</span>
        </button>
      </div>
    </header>
    <div class="tracker-hud" id="tracker-hud" hidden>
      <div class="viewfinder" id="viewfinder" data-gesture="none">
        <video id="feed" autoplay playsinline muted aria-label="手势预览"></video>
        <canvas id="hand-overlay" class="hand-overlay" aria-hidden="true"></canvas>
      </div>
      <div class="gesture-badge" id="gesture-badge" data-gesture="none" aria-live="polite">
        <span class="gesture-dot" aria-hidden="true"></span>
        <span id="gesture-badge-text">未检测到手部</span>
      </div>
    </div>
    <div class="gesture-toast-layer" aria-live="polite">
      <div class="gesture-toast" id="gesture-toast" data-kind="circle" data-visible="false" hidden>
        <div class="toast-art" aria-hidden="true">
          <!-- Hand-drawn animated index-finger circling guide -->
          <svg class="toast-svg toast-svg-circle" viewBox="0 0 112 112" fill="none">
            <!-- Hand-drawn dashed circular orbit around the fingertip -->
            <g class="orbit-guide">
              <ellipse cx="55" cy="31" rx="22" ry="11.5" stroke="#f5d592" stroke-opacity="0.48" stroke-width="1.8" stroke-dasharray="4.5 4" stroke-linecap="round"/>
              <path d="M74 25.5 C77.5 27.5 78.5 31.5 75.5 34.5" stroke="#f8d88f" stroke-width="1.9" stroke-linecap="round"/>
              <path d="M73.5 21.8 L76.6 26.2 L71.2 26.6" stroke="#f8d88f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
            <!-- Orbiting hand-drawn pointing hand + fingertip glow -->
            <g class="hand-orbit">
              <circle class="tip-glow" cx="53" cy="31" r="6.5" fill="#f9d88b" fill-opacity="0.28"/>
              <circle class="tip-dot" cx="53" cy="31" r="2.6" fill="#ffebc0"/>
              <!-- Organic hand-drawn line art: raised index finger, curled others, soft palm -->
              <path d="M47.5 56 C47.2 47 47.8 38.5 49.4 33 C50.5 29.4 55.2 29.4 56 33.2 C56.8 37.8 56.6 45.8 56.2 53" stroke="#eef5fc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              <!-- Curled middle, ring, pinky knuckles -->
              <path d="M56.2 53 C57.8 49.4 63 49.6 63.4 53.6 C63.7 56.5 63.2 59.5 62.6 61.5" stroke="#eef5fc" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M63.4 54.4 C65.2 51.4 69.8 51.8 70.1 55.5 C70.4 58.6 69.7 61.6 68.8 63.8" stroke="#eef5fc" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M70 57.2 C71.8 54.8 75.6 55.6 75.5 59.2 C75.4 63.6 73.6 70.8 70.6 76.2 C67.6 81.4 62.2 84.5 55.5 84.6 C48.8 84.7 43.2 81.2 40.6 75.6 C38.6 71.2 38.4 66 39.2 61.5 C39.8 58 43.2 56.4 45.6 58.2" stroke="#eef5fc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              <!-- Thumb resting across side -->
              <path d="M40.8 66.5 C38 62.5 38.6 56.4 42.4 55.2 C45.4 54.2 47.8 56.8 48.2 60.8 C48.4 63.4 47.2 65.8 45.5 67.2" stroke="#eef5fc" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
              <!-- Soft sketchy palm crease -->
              <path d="M52 67.5 C56.5 66.2 61.8 67.2 65.2 69.8" stroke="#c8dcf2" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round"/>
            </g>
          </svg>

          <!-- Hand-drawn animated fist -> open palm + firework sparks guide -->
          <svg class="toast-svg toast-svg-fireworks" viewBox="0 0 112 112" fill="none">
            <!-- Phase 1: Hand-drawn clenched fist -->
            <g class="fist-pose">
              <!-- Clenched knuckles -->
              <path d="M39 54 C39 48.5 45.2 48.2 45.8 53.5 L45.8 60" stroke="#eef5fc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M45.8 52.5 C46.4 46.8 53.2 46.8 53.6 52.5 L53.4 59.5" stroke="#eef5fc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M53.6 52.5 C54.2 47 61 47.2 61.3 53 L61 60" stroke="#eef5fc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M61.3 54.2 C62 49.4 68.2 49.8 68.4 55 L68 63.5" stroke="#eef5fc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              <!-- Thumb tucked firmly over fingers -->
              <path d="M39 54 C36.6 59 37 68.5 41.2 74.2 C45 79.4 50.8 81.8 57 81.4 C63.8 81 68.2 76.2 68.8 68.8 L68.4 61.5" stroke="#eef5fc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M42.5 64.2 C47 61 54.5 60.4 59.2 62.6 C61.2 63.6 60.8 67.2 57.6 67.8 C52.8 68.6 46.4 68.4 42.5 66.8" stroke="#eef5fc" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
            </g>

            <!-- Phase 2: Hand-drawn open 5-finger palm -->
            <g class="palm-pose">
              <!-- Open palm & five fingers -->
              <path d="M41.5 79 C37.2 73.5 34.8 66.2 33.4 60.8 C31.8 55.2 35.8 52.6 38.8 56.2 L43 62.2 C41.6 52 40.6 42.2 40.8 36.2 C41 31.8 46.2 31.6 46.8 36.2 L48.4 51.4 C48.8 41.5 49.6 33.6 50.8 29.8 C52 26 57.2 26.4 57.4 30.8 L57.4 50.6 C59.2 41.8 61.4 35.2 63.2 32.4 C65.2 29.2 69.8 31.2 68.8 35.4 L65.2 53.8 C68 47.4 71.2 43.2 73.6 41.8 C76.6 40 79.8 43.4 77.6 47.2 C74.4 53.2 71.8 61.4 70.6 68.5 C69.4 76.4 64.2 82.8 56.2 83.8 C49.4 84.6 44.4 82.4 41.5 79 Z" stroke="#eef5fc" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M48.5 68.5 C53 66.4 58.6 66.8 62.6 69.4" stroke="#c8dcf2" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round"/>
            </g>

            <!-- Hand-drawn radial firework sparks bursting outward as palm opens -->
            <g class="palm-sparks" stroke-linecap="round">
              <path d="M55 15 L55 9" stroke="#f9d88b" stroke-width="2"/>
              <path d="M35 22 L30 16" stroke="#9be8ff" stroke-width="2"/>
              <path d="M76 23 L82 17" stroke="#f9d88b" stroke-width="2"/>
              <path d="M23 40 L16 37" stroke="#f9d88b" stroke-width="1.9"/>
              <path d="M88 42 L95 39" stroke="#9be8ff" stroke-width="1.9"/>
              <circle cx="25" cy="26" r="1.8" fill="#ffebc0"/>
              <circle cx="87" cy="27" r="1.8" fill="#b4eeff"/>
              <circle cx="67" cy="14" r="1.5" fill="#ffd288"/>
            </g>
          </svg>
        </div>
        <p class="toast-caption" id="toast-caption">转动指尖试试</p>
      </div>
    </div>
    <div class="controls">
      <div class="actions">
        <button class="button button-style" id="style-toggle" type="button" aria-pressed="false" aria-label="切换 ASCII 风格" title="切换 ASCII 风格">
          <span class="style-glyph" id="style-glyph" aria-hidden="true">#</span>
          <span id="style-label">ASCII</span>
        </button>
      </div>
      <div class="actions actions-center">
        <button class="button button-icon button-sound" id="music" type="button" aria-pressed="true" aria-label="关闭圣诞音乐" title="关闭圣诞音乐">
          <span class="soundwave" aria-hidden="true">
            <span class="soundwave-line"></span>
            <span class="soundwave-bars">
              <i></i><i></i><i></i><i></i><i></i>
            </span>
          </span>
        </button>
      </div>
      <div class="actions">
        <button class="button button-icon button-quiet" id="reset" type="button" aria-label="重置场景" title="重置">
          <svg class="reset-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M4.2 8.4A6.1 6.1 0 1 1 5.6 14.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            <path d="M4.2 4.5V8.6H8.3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="button button-icon button-snow" id="scatter" type="button" aria-label="撒花绽放烟花" title="撒花" disabled>
          <span class="scatter-emoji" aria-hidden="true">🎉</span>
        </button>
      </div>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <noscript><p class="noscript">启用 JavaScript 后即可点亮圣诞树。</p></noscript>
  </main>
</body>
</html>
