<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071221">
  <title>星雪圣诞树</title>
  <meta name="description" content="用食指画圈点亮一棵圣诞树，再撒出烟花和雪。">
  <link rel="icon" href="data:,">
  <link rel="preload" href="./christmas/fonts/great-vibes-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./christmas/style.css">
  <script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js"}}</script>
  <script type="module" src="./christmas/main.js"></script>
</head>
<body>
  <main class="experience">
    <canvas id="stage" aria-label="可旋转的雪霜圣诞树场景" tabindex="0"></canvas>
    <p id="greeting" class="greeting" lang="en" hidden><span>Merry Christmas</span></p>
    <header class="bar">
      <h1><span class="north-star" aria-hidden="true">✧</span> 星雪圣诞树</h1>
      <div class="actions">
        <button class="button button-camera" id="camera" type="button"><span class="camera-symbol" aria-hidden="true"></span><span id="camera-label">开启摄像头</span></button>
      </div>
    </header>
    <div class="viewfinder" id="viewfinder" hidden>
      <video id="feed" autoplay playsinline muted aria-label="手势预览"></video>
      <span id="hand-point" class="hand-point" hidden></span>
    </div>
    <div class="controls">
      <div class="instructions">
        <p id="gesture-instruction">食指画圈点亮圣诞树</p>
        <p id="input-hint">也可拖动树景</p>
      </div>
      <div class="actions">
        <button class="button button-quiet" id="reset" type="button">重置</button>
        <button class="button button-snow" id="scatter" type="button" disabled>撒花</button>
      </div>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <noscript><p class="noscript">启用 JavaScript 后即可点亮圣诞树。</p></noscript>
  </main>
</body>
</html>
